// The release watcher signs with apksigner after Gradle exits.
gradle.beforeProject { project ->
    if (project.path == ':app') {
        project.pluginManager.withPlugin('com.android.application') {
            project.extensions.getByName('androidComponents').finalizeDsl { android ->
                def release = android.buildTypes.getByName('release')
                release.signingConfig = null
                def ndkPath = project.providers.gradleProperty('nexusReleaseNdkPath').orNull
                if (ndkPath) {
                    android.ndkPath = ndkPath
                    release.ndk.debugSymbolLevel = 'FULL'
                }
            }
        }
        project.tasks.configureEach { task ->
            if (task.name.startsWith('uploadSentryProguardMappings')) {
                task.enabled = false
            }
        }
    }
}
